name: Keep Codespace Alive (Unlimited 2-Min Pings)

on:
  schedule:
    # Runs every 6 hours to start a fresh 6-hour loop (GitHub's max job time is 6 hours)
    - cron: "0 */6 * * *"
  # Allows you to run it manually right now to test it
  workflow_dispatch:

jobs:
  ping-codespace:
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping (Loop)
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # Using your repository name
          REPO_NAME="naturedose/xderr"
          
          echo "Searching for active Codespace in $REPO_NAME..."
          CODESPACE_NAME=$(gh codespace list --repo "$REPO_NAME" --json name -q '.[0].name')
          
          if [ -z "$CODESPACE_NAME" ]; then
            echo "⚠️ No Codespace found for $REPO_NAME. Make sure it is running!"
            exit 1
          fi
          
          echo "✅ Found Codespace: $CODESPACE_NAME"
          echo "Starting infinite loop. Pinging every 120 seconds..."
          
          # This loop will run continuously until the 6-hour GitHub Actions limit forces it to stop.
          # Then, the cron schedule above will automatically start a new one!
          while true; do
            echo "Pinging at $(date)..."
            # We use '|| true' so that if the SSH command fails once, the loop doesn't break entirely
            gh codespace ssh -c "$CODESPACE_NAME" -- "echo 'Keep-alive signal received at $(date)' && uptime" || echo "Ping failed, will retry in 2 mins..."
            
            echo "Sleeping for 120 seconds..."
            sleep 120
          done
