name: Keep Codespace Alive

on:
  schedule:
    # Runs every 2 hours to prevent the 4-hour max idle timeout
    - cron: "0 */2 * * *"
  # Allows you to run it manually right now to test it
  workflow_dispatch:

jobs:
  ping-codespace:
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          echo "Fetching all active Codespaces for your account..."
          
          # This fetches ALL your codespaces globally and grabs the first one it finds
          CODESPACE_NAME=$(gh codespace list --json name -q '.[0].name')
          
          if [ -z "$CODESPACE_NAME" ]; then
            echo "⚠️ No Codespace found. Make sure you have an active Codespace running!"
            exit 1
          fi
          
          echo "✅ Found Active Codespace: $CODESPACE_NAME"
          echo "Sending keep-alive ping..."
          
          # Sends a harmless command to keep it awake
          gh codespace ssh -c "$CODESPACE_NAME" -- "echo 'Keep-alive signal received at $(date)' && uptime"
          
          echo "Ping successful. Your Codespace will stay awake."
