name: Keep Codespace Alive

on:
  schedule:
    # Runs every 2 hours to prevent the 4-hour max idle timeout
    - cron: "0 */2 * * *"
  # Allows you to run it manually right now to test it
  workflow_dispatch:

jobs:
  ping-codespace:
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping
        env:
          # We will use a Personal Access Token stored in secrets
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # Using your repository name from the screenshot
          REPO_NAME="naturedose/xder"
          
          echo "Searching for active Codespace in $REPO_NAME..."
          # This command automatically finds the name of your codespace in this repo
          CODESPACE_NAME=$(gh codespace list --repo "$REPO_NAME" --json name -q '.[0].name')
          
          if [ -z "$CODESPACE_NAME" ]; then
            echo "⚠️ No Codespace found for $REPO_NAME. Make sure it is running!"
            exit 1
          fi
          
          echo "✅ Found Codespace: $CODESPACE_NAME"
          echo "Sending ping..."
          
          # Sends a harmless command to keep it alive
          gh codespace ssh -c "$CODESPACE_NAME" -- "echo 'Keep-alive signal received at $(date)' && uptime"
          
          echo "Ping successful. Your Codespace will stay awake."
